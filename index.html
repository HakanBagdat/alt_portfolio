<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hakan Bagdat | Portfolio</title>
  <style>
    :root { --bg:#fff; --fg:#1d1d1f; --accent:#e30613; --card:#f5f5f7; --muted:#6e6e73; }
    body.dark { --bg:#121212; --fg:#eaeaea; --card:#1e1e1e; --muted:#9a9a9a; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:system-ui, sans-serif; background:var(--bg); color:var(--fg); line-height:1.6; }
    header { position:sticky; top:0; z-index:10; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:.5rem; padding:1rem 2rem; background:var(--bg); border-bottom:1px solid #8884; }
    header strong { color:var(--accent); }
    nav a { margin-left:1rem; color:var(--fg); text-decoration:none; }
    nav a:hover { color:var(--accent); }
    #themeBtn { background:none; border:1px solid var(--accent); color:var(--accent); padding:.3rem .7rem; border-radius:6px; cursor:pointer; margin-left:1rem; }
    section { max-width:900px; margin:3rem auto; padding:0 1.5rem; }
    .hero { text-align:center; padding:5rem 1.5rem 3rem; }
    .hero h1 { font-size:2.6rem; }
    .hero h1 span { color:var(--accent); }
    .subtitle { opacity:.8; margin-top:.5rem; }
    .btn { display:inline-block; margin-top:1.5rem; padding:.7rem 1.4rem; background:var(--accent); color:#fff; border-radius:8px; text-decoration:none; border:none; cursor:pointer; font:inherit; }
    h2 { margin-bottom:1.2rem; border-left:4px solid var(--accent); padding-left:.7rem; }
    .card { background:var(--card); padding:1.2rem 1.4rem; border-radius:10px; margin-bottom:1rem; }
    .meta { font-size:.9rem; color:var(--muted); margin-bottom:.4rem; }
    .tags { display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.6rem; }
    .tag { font-size:.8rem; padding:.2rem .6rem; border:1px solid var(--accent); color:var(--accent); border-radius:20px; }
    .filters button { margin:0 .3rem .8rem 0; padding:.4rem .9rem; border:1px solid var(--accent); background:none; color:var(--fg); border-radius:20px; cursor:pointer; }
    .filters button.active { background:var(--accent); color:#fff; }
    .skill-group { margin-bottom:1.2rem; }
    form input, form textarea { width:100%; padding:.7rem; margin-bottom:.8rem; border:1px solid #8886; border-radius:6px; background:var(--bg); color:var(--fg); font:inherit; }
    footer { text-align:center; padding:2rem; opacity:.6; font-size:.9rem; }
    .hidden { display:none !important; }
    @media (max-width:600px) { nav a { margin:0 .5rem; } }
  </style>
</head>
<body>

<header>
  <strong>HB</strong>
  <nav id="nav"></nav>
  <button id="themeBtn" title="Design wechseln">🌙</button>
</header>

<main id="app"></main>
<footer id="footer"></footer>

<script>
  // ===== Hier nur den Inhalt bearbeiten =====
  const DATA = {
    name: "Hakan Bagdat",
    title: "Compliance & Security Specialist | SAP-Entwickler",
    intro: "Compliance- und Security-Spezialist mit Hintergrund in Recht, Sicherheitswissenschaften und Ermittlungsarbeit. Seit 2022 zusätzlich Erfahrung in der SAP-Entwicklung (ABAP, SAP HANA, SAP Fiori).",
    email: "ihr@beispiel.de",

    skills: [
      { group: "SAP-Entwicklung", items: ["ABAP", "ABAP in Eclipse", "SAP Smart Forms", "SAP Fiori (Grundkenntnisse)", "SAP HANA 2.0"] },
      { group: "SAP Security & Compliance", items: ["SAP Security Alerts", "SAP GRC Process Control", "IT- und ITGC-Kontrollen"] },
      { group: "Web (Grundkenntnisse)", items: ["HTML", "CSS", "JavaScript", "Node.js", "SQL"] }
    ],

    experience: [
      { role: "Professional Compliance & Security Specialist", org: "Swisscom", from: "2023", to: "heute",
        desc: "Durchführung von IT- und ITGC-Kontrollen, Überwachung von SAP-Security-Alerts, Arbeit mit SAP GRC Process Control." },
      { role: "Junior SAP ABAP Entwickler", org: "Swisscom", from: "2022", to: "2023",
        desc: "Entwicklung mit ABAP in Eclipse, SAP Smart Forms und Mitarbeit an der Neuentwicklung einer internen Anwendung." },
      { role: "Praktikant SAP Services", org: "Swisscom", from: "03/2022", to: "04/2022",
        desc: "Modellierung eines Datenbankmodells in SAP HANA und Entwicklung einer SAP-Fiori-App." },
      { role: "Associate Rechtsberater", org: "Sachverständigenbüro, Türkei", from: "2016", to: "2020",
        desc: "Rechtliche Beratung und Begutachtung." },
      { role: "Kriminalermittler, Polizeikommissar", org: "Türkei", from: "2014", to: "2016",
        desc: "Kriminalermittlungen." }
    ],

    education: [
      { degree: "Bachelor Rechtswissenschaft", org: "Anadolu Universität", from: "2015", to: "2018" },
      { degree: "Bachelor Sicherheitswissenschaften", org: "Polizeiakademie", from: "2008", to: "2012" }
    ],

    certificates: [
      { title: "CHANGEMAKERS 3.0 – SAP HANA Training", org: "SAP & socialbee", year: "2022",
        desc: "Module HA100, HA300 und HA301. Zertifikatsprüfung bestanden." }
    ],

    projects: [
      { title: "SAP HANA Datenmodell & SAP Fiori App", cat: "SAP",
        meta: "Swisscom · Praktikum · 2022", desc: "Datenbankmodell in SAP HANA und eine SAP-Fiori-App.",
        tags: ["SAP HANA", "SAP Fiori"] },
      { title: "BERATERTOOLS – Neuentwicklung", cat: "SAP",
        meta: "Swisscom · Entwicklungsteam · 2022", desc: "Mitarbeit an der Neuentwicklung mit ABAP.",
        tags: ["ABAP"] }
    ],

    languages: [
      { name: "Deutsch", level: "Upper-Intermediate (B2)" },
      { name: "Türkisch", level: "Muttersprache" }
    ]
  };
  // ==========================================

  function el(tag, attrs = {}, children = []) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") e.className = v;
      else if (k === "text") e.textContent = v;
      else e.setAttribute(k, v);
    }
    children.forEach(c => e.append(c));
    return e;
  }
  const tagList = tags => el("div", { class: "tags" }, tags.map(t => el("span", { class: "tag", text: t })));
  const period = (from, to) => [from, to].filter(Boolean).join(" – ");

  const sections = [
    { id: "about", label: "Über mich", render: () => el("section", { id: "about" }, [
      el("h2", { text: "Über mich" }),
      el("p", { text: DATA.intro }),
      el("h3", { text: "Kompetenzen", style: "margin:1.5rem 0 .8rem" }),
      ...DATA.skills.map(g => el("div", { class: "skill-group" }, [el("h3", { text: g.group }), tagList(g.items)]))
    ])},
    { id: "erfahrung", label: "Erfahrung", render: () => el("section", { id: "erfahrung" }, [
      el("h2", { text: "Berufserfahrung" }),
      ...DATA.experience.map(x => el("div", { class: "card" }, [
        el("h3", { text: x.role }),
        el("p", { class: "meta", text: `${x.org} · ${period(x.from, x.to)}` }),
        el("p", { text: x.desc })
      ]))
    ])},
    { id: "ausbildung", label: "Ausbildung", render: () => el("section", { id: "ausbildung" }, [
      el("h2", { text: "Ausbildung & Zertifikate" }),
      ...DATA.education.map(x => el("div", { class: "card" }, [
        el("h3", { text: x.degree }),
        el("p", { class: "meta", text: `${x.org} · ${period(x.from, x.to)}` })
      ])),
      ...DATA.certificates.map(c => el("div", { class: "card" }, [
        el("h3", { text: c.title }),
        el("p", { class: "meta", text: `${c.org} · ${c.year}` }),
        el("p", { text: c.desc })
      ]))
    ])},
    { id: "projekte", label: "Projekte", render: () => {
      const cats = [...new Set(DATA.projects.map(p => p.cat))];
      const filters = el("div", { class: "filters" }, [
        el("button", { class: "active", "data-filter": "all", text: "Alle" }),
        ...cats.map(c => el("button", { "data-filter": c, text: c }))
      ]);
      const cards = DATA.projects.map(p => el("div", { class: "card project", "data-cat": p.cat }, [
        el("h3", { text: p.title }),
        el("p", { class: "meta", text: p.meta }),
        el("p", { text: p.desc }),
        tagList(p.tags)
      ]));
      return el("section", { id: "projekte" }, [el("h2", { text: "Projekte" }), filters, ...cards]);
    }},
    { id: "sprachen", label: "Sprachen", render: () => el("section", { id: "sprachen" }, [
      el("h2", { text: "Sprachen" }),
      el("ul", {}, DATA.languages.map(l => el("li", { text: `${l.name}: ${l.level}` })))
    ])},
    { id: "kontakt", label: "Kontakt", render: () => el("section", { id: "kontakt" }, [
      el("h2", { text: "Kontakt" }),
      el("form", { id: "contactForm" }, [
        el("input", { type: "text", id: "name", placeholder: "Ihr Name", required: "" }),
        el("input", { type: "email", id: "email", placeholder: "Ihre E-Mail-Adresse", required: "" }),
        el("textarea", { id: "message", rows: "4", placeholder: "Ihre Nachricht", required: "" }),
        el("button", { class: "btn", type: "submit", text: "Senden" })
      ]),
      el("p", { style: "margin-top:1.5rem" }, [
        document.createTextNode("E-Mail: "),
        el("a", { href: "mailto:" + DATA.email, text: DATA.email })
      ])
    ])}
  ];

  const app = document.getElementById("app");
  app.append(el("div", { class: "hero" }, [
    el("h1", {}, [document.createTextNode("Hallo, ich bin "), el("span", { text: DATA.name })]),
    el("p", { class: "subtitle", text: DATA.title }),
    el("a", { class: "btn", href: "#projekte", text: "Meine Projekte ansehen" })
  ]));
  sections.forEach(s => app.append(s.render()));

  const nav = document.getElementById("nav");
  sections.forEach(s => nav.append(el("a", { href: "#" + s.id, text: s.label })));
  document.getElementById("footer").textContent = `© ${new Date().getFullYear()} ${DATA.name}`;

  const btn = document.getElementById("themeBtn");
  btn.onclick = () => {
    document.body.classList.toggle("dark");
    btn.textContent = document.body.classList.contains("dark") ? "☀️" : "🌙";
  };

  document.addEventListener("click", e => {
    const b = e.target.closest(".filters button");
    if (!b) return;
    document.querySelectorAll(".filters button").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    const f = b.dataset.filter;
    document.querySelectorAll(".project").forEach(p =>
      p.classList.toggle("hidden", f !== "all" && p.dataset.cat !== f));
  });

  document.getElementById("contactForm").onsubmit = e => {
    e.preventDefault();
    const n = document.getElementById("name").value;
    const m = document.getElementById("message").value;
    const mail = document.getElementById("email").value;
    location.href = `mailto:${DATA.email}?subject=Portfolio-Nachricht von ${encodeURIComponent(n)}&body=${encodeURIComponent(m + "\n\nAbsender: " + mail)}`;
  };
</script>
</body>
</html>
